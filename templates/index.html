<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>X 영상 다운로더</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f7f9; --card:#fff; --fg:#111; --muted:#667; --accent:#1d9bf0; --border:#dde; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1114; --card:#1a1d22; --fg:#eee; --muted:#99a; --border:#2b2f36; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,-apple-system,"Noto Sans KR",sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .row { display:flex; gap:8px; }
  input { flex:1; min-width:0; padding:12px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--fg); font-size:1rem; }
  button { padding:12px 18px; border:0; border-radius:10px; background:var(--accent); color:#fff; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.5; cursor:wait; }
  .err { color:#e0245e; margin-top:12px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; margin-top:16px; }
  .card img { width:100%; border-radius:10px; }
  .card h3 { margin:10px 0 2px; font-size:1rem; }
  .card small { color:var(--muted); }
  .dl { display:flex; flex-wrap:wrap; gap:8px; margin-top:12px; }
  .dl a { text-decoration:none; padding:10px 14px; border-radius:10px; background:var(--accent); color:#fff; }
  footer { margin-top:32px; color:var(--muted); font-size:.8rem; }
</style>
</head>
<body>
<main>
  <h1>X 영상 다운로더</h1>
  <p class="sub">X(트위터) 트윗 링크를 붙여넣으면 영상/GIF를 mp4로 받아요.</p>
  <form id="f" class="row">
    <input id="url" type="url" placeholder="https://x.com/user/status/123456789" required autofocus>
    <button id="go">가져오기</button>
  </form>
  <div id="err" class="err"></div>
  <div id="out"></div>
  <footer>본인이 볼 권리가 있는 콘텐츠만, 개인 용도로 사용하세요. 저작권은 원작자에게 있습니다.</footer>
</main>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
$("#f").addEventListener("submit", async e => {
  e.preventDefault();
  const url = $("#url").value.trim();
  $("#err").textContent = ""; $("#out").innerHTML = "";
  $("#go").disabled = true; $("#go").textContent = "불러오는 중…";
  try {
    const r = await fetch("/api/info", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({url})});
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || "실패");
    $("#out").innerHTML = d.items.map(it => {
      const links = it.formats.length
        ? it.formats.map(f => `<a href="/api/download?url=${encodeURIComponent(url)}&index=${it.index}&format=${encodeURIComponent(f.format_id)}">${esc(f.label)} ${esc(f.size)}</a>`).join("")
        : `<a href="/api/download?url=${encodeURIComponent(url)}&index=${it.index}">다운로드</a>`;
      return `<div class="card">
        ${it.thumbnail ? `<img src="${esc(it.thumbnail)}" alt="" referrerpolicy="no-referrer">` : ""}
        <h3>${esc(it.title)}</h3><small>@${esc(it.uploader)} ${it.duration ? "· " + Math.round(it.duration) + "초" : ""}</small>
        <div class="dl">${links}</div></div>`;
    }).join("");
  } catch (err) { $("#err").textContent = err.message; }
  finally { $("#go").disabled = false; $("#go").textContent = "가져오기"; }
});
</script>
</body>
</html>
