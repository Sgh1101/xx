name: Build Android APK

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: x-downloader-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # 폰에서 바로 받을 수 있도록 Releases 에도 올림
      - name: Publish APK to release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest-debug --cleanup-tag -y || true
          gh release create latest-debug android/app/build/outputs/apk/debug/app-debug.apk \
            --prerelease --title "X 다운로더 (최신 디버그 APK)" \
            --notes "자동 빌드: ${GITHUB_SHA::7}" --target "$GITHUB_SHA"
